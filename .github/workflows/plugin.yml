name: CPA plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux_amd64, runner: ubuntu-22.04, arch: x64}
          - {target: linux_arm64, runner: ubuntu-22.04-arm, arch: arm64}
          - {target: darwin_amd64, runner: macos-15-intel, arch: x64}
          - {target: darwin_arm64, runner: macos-15, arch: arm64}
          - {target: windows_amd64, runner: windows-2022, arch: x64}
          - {target: windows_arm64, runner: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          architecture: ${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}
          cache-dependency-path: src/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Windows ARM64 toolchain
        if: matrix.target == 'windows_arm64'
        id: arm64-toolchain
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
      - name: Windows C compiler
        if: matrix.target == 'windows_amd64'
        shell: pwsh
        run: |
          $compilerBin = 'C:\mingw64\bin'
          if (!(Test-Path "$compilerBin\gcc.exe")) { throw 'Missing native MinGW compiler' }
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$compilerBin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Windows ARM64 compiler
        if: matrix.target == 'windows_arm64'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.arm64-toolchain.outputs.msys2-location }}
        run: |
          $compilerBin = Join-Path $env:MSYS2_LOCATION 'clangarm64\bin'
          $compiler = Join-Path $compilerBin 'clang.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Missing native ARM64 compiler' }
          $compilerTarget = & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $compilerTarget -notmatch '^aarch64-') { throw 'Compiler does not target ARM64' }
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Tests and standalone build
        working-directory: src
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$NATIVE_TARGET" == 'windows_arm64' ]]; then
            # Go's race detector does not support windows/arm64.
            go test ./...
          else
            go test -race ./...
          fi
          go vet ./...
          mkdir -p ../plugin-dist
          go build -o ../plugin-dist/standalone .
      - name: Package validation tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/ui_smoke.cjs
      - name: Build, load C ABI, and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/build_plugin.py --release-tag "$RELEASE_TAG" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.target }}
          path: |
            plugin-dist/*.zip
            plugin-dist/checksums-*.txt
          if-no-files-found: error
  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: plugin-dist
          merge-multiple: true
      - name: Assemble checksums and registry
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_plugin.py --assemble-release --release-tag "$RELEASE_TAG"
          python scripts/build_plugin.py --registry "$REPOSITORY"
      - name: Create release draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" plugin-dist/*.zip plugin-dist/checksums.txt plugin-dist/registry.json --verify-tag --draft --generate-notes
